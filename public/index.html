<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020408">
  <title>J.A.R.V.I.S.</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #020408;
      --core: #00b4ff;
      --core-g: rgba(0,180,255,0.08);
      --core-m: rgba(0,180,255,0.25);
      --core-h: rgba(0,180,255,0.5);
      --white: #e8f4ff;
      --dim: rgba(200,225,245,0.4);
      color-scheme: dark;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh; height: 100dvh;
      user-select: none; -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .reactor {
      position: relative;
      z-index: 2;
      width: 300px; height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .reactor svg { position: absolute; width: 100%; height: 100%; }

    .r-glow {
      position: absolute;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--core-h) 0%, var(--core-g) 50%, transparent 70%);
      filter: blur(8px);
      animation: glow-breathe 4s ease-in-out infinite;
      transition: background 0.5s;
    }

    @keyframes glow-breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .ring-outer { animation: spin 25s linear infinite; transform-origin: center; }
    .ring-mid { animation: spin 18s linear infinite reverse; transform-origin: center; }
    .ring-inner { animation: spin 12s linear infinite; transform-origin: center; }
    .ring-core { animation: spin 30s linear infinite reverse; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .wave-ring { position: absolute; width: 170px; height: 170px; border-radius: 50%; }
    .wave-bar {
      position: absolute; width: 2px; background: var(--core); border-radius: 1px;
      bottom: 50%; left: 50%; transform-origin: bottom center;
      opacity: 0.4; transition: height 0.08s ease, opacity 0.3s;
    }

    .reactor[data-state="listening"] .r-glow {
      background: radial-gradient(circle, rgba(0,255,160,0.5) 0%, rgba(0,255,160,0.08) 50%, transparent 70%);
      animation: glow-pulse 0.8s ease-in-out infinite;
    }
    .reactor[data-state="listening"] .wave-bar { opacity: 0.8; }
    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .reactor[data-state="thinking"] .r-glow {
      background: radial-gradient(circle, rgba(255,170,50,0.5) 0%, rgba(255,170,50,0.08) 50%, transparent 70%);
      animation: glow-think 1.5s ease-in-out infinite;
    }
    @keyframes glow-think {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .reactor[data-state="speaking"] .r-glow {
      background: radial-gradient(circle, rgba(100,120,255,0.55) 0%, rgba(100,120,255,0.08) 50%, transparent 70%);
      animation: glow-speak 0.5s ease-in-out infinite alternate;
    }
    @keyframes glow-speak { from { transform: scale(1); } to { transform: scale(1.2); } }

    .reactor[data-state="error"] .r-glow {
      background: radial-gradient(circle, rgba(255,60,60,0.5) 0%, rgba(255,60,60,0.08) 50%, transparent 70%);
    }

    .float-text {
      position: fixed; z-index: 10; left: 50%; bottom: 14%;
      transform: translateX(-50%); width: 88%; max-width: 500px;
      text-align: center; font-family: 'Rajdhani', sans-serif;
      font-size: clamp(16px, 4vw, 20px); font-weight: 300;
      line-height: 1.6; color: var(--white); letter-spacing: 0.5px;
      opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
    }
    .float-text.visible { opacity: 1; }
    .float-text .heard {
      font-size: clamp(11px, 2.5vw, 13px); color: var(--dim);
      letter-spacing: 2px; text-transform: uppercase;
      font-family: 'Orbitron', sans-serif; margin-bottom: 10px;
    }

    .status {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      left: 50%; transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif; font-size: 10px;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--core); opacity: 0.35; z-index: 5; transition: all 0.5s;
    }
    .status.active { opacity: 0.8; }

    .clock {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px);
      left: 50%; transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 300;
      letter-spacing: 6px; color: var(--core); opacity: 0.25; z-index: 5;
    }

    .hint {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 50px);
      left: 50%; transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif; font-size: 9px;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--dim); z-index: 5; opacity: 0;
      animation: hint-fade 8s ease-in-out 2s forwards;
    }
    @keyframes hint-fade {
      0% { opacity: 0; } 15% { opacity: 0.6; } 85% { opacity: 0.6; } 100% { opacity: 0; }
    }

    .corner { position: fixed; z-index: 5; pointer-events: none; }
    .corner svg { width: 40px; height: 40px; }
    .corner.tl { top: calc(env(safe-area-inset-top, 0px) + 8px); left: 8px; }
    .corner.tr { top: calc(env(safe-area-inset-top, 0px) + 8px); right: 8px; }
    .corner.bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); left: 8px; }
    .corner.br { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); right: 8px; }

    .ripple {
      position: absolute; border-radius: 50%; border: 1px solid var(--core);
      opacity: 0.6; animation: ripple-out 1s ease-out forwards; pointer-events: none;
    }
    @keyframes ripple-out {
      0% { width: 60px; height: 60px; opacity: 0.6; margin: -30px; }
      100% { width: 400px; height: 400px; opacity: 0; margin: -200px; }
    }

    .scanline {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,180,255,0.012) 2px, rgba(0,180,255,0.012) 4px);
    }

    .conn {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px);
      right: 16px; width: 8px; height: 8px; border-radius: 50%;
      background: #39ff14; z-index: 5; box-shadow: 0 0 6px rgba(57,255,20,0.5);
    }
    .conn.offline { background: #ff4757; box-shadow: 0 0 6px rgba(255,71,87,0.5); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 400px) {
      .reactor { width: 240px; height: 240px; }
      .r-glow { width: 110px; height: 110px; }
      .wave-ring { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="scanline"></div>

  <div class="corner tl"><svg viewBox="0 0 40 40"><path d="M0 20V2a2 2 0 012-2h18" stroke="rgba(0,180,255,0.3)" fill="none" stroke-width="1.5"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 40 40"><path d="M40 20V2a2 2 0 00-2-2H20" stroke="rgba(0,180,255,0.3)" fill="none" stroke-width="1.5"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 40 40"><path d="M0 20v18a2 2 0 002 2h18" stroke="rgba(0,180,255,0.3)" fill="none" stroke-width="1.5"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 40 40"><path d="M40 20v18a2 2 0 01-2 2H20" stroke="rgba(0,180,255,0.3)" fill="none" stroke-width="1.5"/></svg></div>

  <div class="clock" id="clock"></div>
  <div class="conn" id="conn"></div>

  <div class="reactor" id="reactor" data-state="idle">
    <svg viewBox="0 0 300 300" fill="none">
      <g class="ring-outer">
        <circle cx="150" cy="150" r="145" stroke="rgba(0,180,255,0.08)" stroke-width="0.5"/>
        <circle cx="150" cy="150" r="140" stroke="rgba(0,180,255,0.12)" stroke-width="0.5" stroke-dasharray="4 12"/>
        <g stroke="rgba(0,180,255,0.15)" stroke-width="0.8">
          <line x1="150" y1="5" x2="150" y2="18"/><line x1="150" y1="282" x2="150" y2="295"/>
          <line x1="5" y1="150" x2="18" y2="150"/><line x1="282" y1="150" x2="295" y2="150"/>
        </g>
      </g>
      <g class="ring-mid">
        <circle cx="150" cy="150" r="120" stroke="rgba(0,180,255,0.1)" stroke-width="0.5"/>
        <circle cx="150" cy="150" r="115" stroke="rgba(0,180,255,0.18)" stroke-width="1" stroke-dasharray="2 8"/>
        <path d="M150 35 A115 115 0 0 1 253 95" stroke="rgba(0,180,255,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M150 265 A115 115 0 0 1 47 205" stroke="rgba(0,180,255,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <g class="ring-inner">
        <circle cx="150" cy="150" r="92" stroke="rgba(0,180,255,0.12)" stroke-width="0.5"/>
        <circle cx="150" cy="150" r="88" stroke="rgba(0,180,255,0.25)" stroke-width="1" stroke-dasharray="1 6"/>
        <polygon points="150,62 153,68 147,68" fill="rgba(0,180,255,0.3)"/>
        <polygon points="150,238 153,232 147,232" fill="rgba(0,180,255,0.3)"/>
        <polygon points="62,150 68,147 68,153" fill="rgba(0,180,255,0.3)"/>
        <polygon points="238,150 232,147 232,153" fill="rgba(0,180,255,0.3)"/>
      </g>
      <g class="ring-core">
        <circle cx="150" cy="150" r="55" stroke="rgba(0,180,255,0.3)" stroke-width="1.5"/>
        <circle cx="150" cy="150" r="50" stroke="rgba(0,180,255,0.15)" stroke-width="0.5" stroke-dasharray="3 5"/>
      </g>
      <circle cx="150" cy="150" r="4" fill="var(--core)" opacity="0.8"/>
      <circle cx="150" cy="150" r="8" fill="none" stroke="var(--core)" stroke-width="0.5" opacity="0.4"/>
    </svg>
    <div class="r-glow"></div>
    <div class="wave-ring" id="waveRing"></div>
  </div>

  <div class="float-text" id="floatText">
    <div class="heard" id="heardText"></div>
    <div id="responseText"></div>
  </div>

  <div class="status" id="status">Systeme Online</div>
  <div class="hint">Tippe auf den Reaktor</div>

  <script>
  (function() {
    'use strict';

    const SESSION_ID = 'jarvis_' + Math.random().toString(36).slice(2, 10);

    const cv = document.getElementById('bgCanvas');
    const cx = cv.getContext('2d');
    let W, H;
    const pts = [];

    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    resize();
    addEventListener('resize', resize);

    const N = Math.min(50, Math.floor(W * H / 25000));
    for (let i = 0; i < N; i++) {
      pts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
        r: Math.random() * 1 + 0.3, a: Math.random() * 0.15 + 0.03
      });
    }

    function draw() {
      cx.clearRect(0, 0, W, H);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        cx.beginPath();
        cx.arc(p.x, p.y, p.r, 0, 6.28);
        cx.fillStyle = `rgba(0,180,255,${p.a})`;
        cx.fill();
      }
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 150) {
            cx.beginPath();
            cx.moveTo(pts[i].x, pts[i].y);
            cx.lineTo(pts[j].x, pts[j].y);
            cx.strokeStyle = `rgba(0,180,255,${0.03 * (1 - d / 150)})`;
            cx.lineWidth = 0.4;
            cx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    draw();

    const waveRing = document.getElementById('waveRing');
    const bars = [];
    for (let i = 0; i < 48; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      bar.style.transform = `rotate(${(i / 48) * 360}deg)`;
      bar.style.height = '3px';
      waveRing.appendChild(bar);
      bars.push(bar);
    }

    let waveAnim = null;
    function animateWave(intensity) {
      if (waveAnim) cancelAnimationFrame(waveAnim);
      (function tick() {
        for (let i = 0; i < bars.length; i++) {
          bars[i].style.height = (3 + Math.random() * intensity + Math.sin(Date.now() / 200 + i * 0.5) * intensity * 0.5) + 'px';
        }
        waveAnim = requestAnimationFrame(tick);
      })();
    }
    function stopWave() {
      if (waveAnim) cancelAnimationFrame(waveAnim);
      bars.forEach(b => b.style.height = '3px');
    }

    const clockEl = document.getElementById('clock');
    function updateClock() {
      const n = new Date();
      clockEl.textContent = n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
    }
    updateClock();
    setInterval(updateClock, 10000);

    const reactor = document.getElementById('reactor');
    const statusEl = document.getElementById('status');
    const floatText = document.getElementById('floatText');
    const heardText = document.getElementById('heardText');
    const responseEl = document.getElementById('responseText');
    const connEl = document.getElementById('conn');
    let hideTimer = null;
    let busy = false;

    function setState(s, label) {
      reactor.dataset.state = s;
      statusEl.textContent = label;
      statusEl.classList.toggle('active', s !== 'idle');
      if (s === 'listening') animateWave(15);
      else if (s === 'speaking') animateWave(10);
      else if (s === 'thinking') animateWave(4);
      else stopWave();
    }

    function showText(heard, text) {
      if (hideTimer) clearTimeout(hideTimer);
      heardText.textContent = heard ? `"${heard}"` : '';
      responseEl.textContent = '';
      floatText.classList.add('visible');
      let i = 0;
      (function type() {
        if (i < text.length) {
          responseEl.textContent += text[i++];
          setTimeout(type, 22);
        } else {
          hideTimer = setTimeout(() => floatText.classList.remove('visible'), 15000);
        }
      })();
    }

    function spawnRipple() {
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = '50%'; r.style.top = '50%';
      reactor.appendChild(r);
      setTimeout(() => r.remove(), 1000);
    }

    async function checkHealth() {
      try {
        const r = await fetch('/api/health');
        const d = await r.json();
        connEl.classList.toggle('offline', d.keys === 0);
      } catch {
        connEl.classList.add('offline');
      }
    }
    checkHealth();

    async function askJarvis(input) {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: input, sessionId: SESSION_ID })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Server-Fehler');
      }
      return (await res.json()).reply;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return Promise.resolve();
      return new Promise(resolve => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        u.rate = 0.92;
        u.pitch = 0.85;
        const voices = speechSynthesis.getVoices();
        const v = voices.find(v => v.lang.startsWith('de') && /male/i.test(v.name))
               || voices.find(v => v.lang.startsWith('de'))
               || voices[0];
        if (v) u.voice = v;
        u.onend = resolve;
        u.onerror = resolve;
        speechSynthesis.speak(u);
      });
    }
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    async function process(input) {
      if (busy) return;
      busy = true;
      setState('thinking', 'Verarbeite');

      try {
        const answer = await askJarvis(input);
        setState('speaking', 'Spreche');
        showText(input, answer);
        await speak(answer);
      } catch (err) {
        setState('error', 'Fehler');
        showText(input, err.message || 'Verbindung fehlgeschlagen.');
        await new Promise(r => setTimeout(r, 2000));
      }

      setState('idle', 'Bereit');
      busy = false;
    }

    let recognition = null;
    let listening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'de-DE';
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => { listening = true; setState('listening', 'Höre zu'); };

      recognition.onresult = (e) => {
        let final = '', interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        if (interim) {
          heardText.textContent = `"${interim}"`;
          responseEl.textContent = '';
          floatText.classList.add('visible');
        }
        if (final) process(final);
      };

      recognition.onend = () => {
        listening = false;
        if (reactor.dataset.state === 'listening') setState('idle', 'Bereit');
      };

      recognition.onerror = (e) => {
        listening = false;
        if (e.error === 'not-allowed') showText('', 'Mikrofonzugriff erlauben in den Einstellungen.');
        setState('idle', 'Bereit');
      };
    }

    reactor.addEventListener('click', () => {
      spawnRipple();
      if (busy) return;
      if (!recognition) {
        showText('', 'Spracherkennung nicht unterstützt. Bitte Safari verwenden.');
        return;
      }
      if (listening) { recognition.stop(); }
      else {
        if (reactor.dataset.state === 'speaking') speechSynthesis.cancel();
        try { recognition.start(); } catch(e) {}
      }
    });

    const bootSteps = ['Initialisiere', 'Verbinde KI', 'Lade Sprachmodule', 'Bereit'];
    let bi = 0;
    (function boot() {
      if (bi < bootSteps.length) {
        statusEl.textContent = bootSteps[bi++];
        statusEl.classList.add('active');
        setTimeout(boot, 400);
      } else { statusEl.classList.remove('active'); }
    })();

  })();
  </script>
</body>
</html>
